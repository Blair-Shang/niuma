<!DOCTYPE html>
<!--
  冷启动品牌页（Shell SplashWindow 专用）。
  - 放在 public/：Vite 原样输出为 /splash.html；打包后为 app://niuma/splash.html
  - 禁止依赖 Vue / 主应用 bundle，保证 CEF 一加载即可出画面
  - 主题仅读 localStorage niuma-theme，与 index.html 启动层一致
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/app-icon-256.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>NiuMa</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--splash-bg, #181818);
        color: var(--splash-fg, rgba(255, 255, 255, 0.78));
        font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      .splash {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 28px 32px 32px;
      }

      .splash__logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }

      .splash__brand {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.02em;
        color: var(--splash-brand, rgba(255, 255, 255, 0.92));
      }

      .splash__status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 20px;
        color: var(--splash-fg, rgba(255, 255, 255, 0.62));
      }

      .splash__spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--splash-track, rgba(255, 255, 255, 0.14));
        border-top-color: var(--splash-accent, rgba(255, 255, 255, 0.88));
        border-radius: 50%;
        animation: splash-spin 0.75s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('niuma-theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              globalThis.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) {
            root.style.setProperty('--splash-bg', '#181818')
            root.style.setProperty('--splash-fg', 'rgba(255,255,255,0.62)')
            root.style.setProperty('--splash-brand', 'rgba(255,255,255,0.92)')
            root.style.setProperty('--splash-track', 'rgba(255,255,255,0.14)')
            root.style.setProperty('--splash-accent', 'rgba(255,255,255,0.88)')
            root.style.colorScheme = 'dark'
          } else {
            root.style.setProperty('--splash-bg', '#f5f5f7')
            root.style.setProperty('--splash-fg', 'rgba(0,0,0,0.55)')
            root.style.setProperty('--splash-brand', 'rgba(0,0,0,0.88)')
            root.style.setProperty('--splash-track', 'rgba(0,0,0,0.1)')
            root.style.setProperty('--splash-accent', 'rgba(0,0,0,0.72)')
            root.style.colorScheme = 'light'
          }
          root.style.background = getComputedStyle(root).getPropertyValue('--splash-bg')
        } catch (e) {
          console.warn('[niuma] splash theme skipped:', e)
        }
      })()
    </script>
  </head>
  <body>
    <div class="splash" aria-live="polite" aria-busy="true">
      <img class="splash__logo" src="/favicon.svg" width="64" height="64" alt="" />
      <h1 class="splash__brand">NiuMa</h1>
      <div class="splash__status">
        <div class="splash__spinner" aria-hidden="true"></div>
        <span>正在启动…</span>
      </div>
    </div>
  </body>
</html>
