# NiuMa 本机构建打包流水线。
# 约束：build/pack/release 必须在目标 OS 上执行，禁止交叉编译。
# 托管 runner 覆盖：Windows x64、Linux x64、macOS arm64。
# ARM64 Windows / ARM64 Linux / 麒麟需自建 runner，未纳入本矩阵。
name: Pack and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      niuma_ui_ref:
        description: 'niuma-ui git ref (private sibling repo)'
        type: string
        default: 'v1.1.9'

concurrency:
  group: pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  pack:
    name: pack (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: NiuMa
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            pack_cmd: pnpm release:win
            cef_cmd: pnpm cef:download
            rust_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            artifact: linux-x64
            pack_cmd: pnpm release:linux
            cef_cmd: pnpm cef:download:linux
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-14
            artifact: macos-arm64
            pack_cmd: pnpm release:macos:arm64
            cef_cmd: pnpm cef:download:macos
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout NiuMa
        uses: actions/checkout@v5
        with:
          path: NiuMa

      - name: Checkout niuma-ui
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/niuma-ui
          ref: ${{ github.event.inputs.niuma_ui_ref || 'v1.1.9' }}
          path: niuma-ui
          token: ${{ secrets.NIUMA_UI_TOKEN || github.token }}

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
        working-directory: .

      - name: Install Linux CEF / pack dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xz-utils \
            dpkg-dev fakeroot \
            libgtk-3-dev libgbm-dev libnss3-dev libxss-dev libasound2-dev \
            libcups2-dev libatk1.0-dev libpango1.0-dev libcairo2-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libx11-xcb-dev libxcb-dri3-dev libdrm-dev libxkbcommon-dev \
            libxi-dev libxtst-dev libnotify-dev libglib2.0-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $iscc) {
            echo "$iscc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            NiuMa/pnpm-lock.yaml
            niuma-ui/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # 必须与仓库根 go.work 一致。setup-go 默认 GOTOOLCHAIN=local，
          # 若只装 1.25.0，Linux/macOS 的 go generate 都会失败。
          go-version: '1.25.7'
          cache-dependency-path: |
            NiuMa/go.work
            NiuMa/go.work.sum
            NiuMa/platform/go.sum
            NiuMa/services/**/go.sum
            NiuMa/packages/go/**/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust workspaces
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            NiuMa/services/ssh-service
            NiuMa/services/redis-service
            NiuMa/packages/rust

      - name: Restore CEF cache
        id: cef-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            NiuMa/third_party/cef
            NiuMa/third_party/cef-cache
          key: cef-${{ matrix.artifact }}-${{ hashFiles('NiuMa/scripts/shared/setup/cef-pin.txt') }}
          restore-keys: |
            cef-${{ matrix.artifact }}-

      - name: Import Windows Authenticode PFX
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          pwsh -ExecutionPolicy Bypass -File .github/scripts/import-windows-pfx.ps1

      - name: Import macOS Developer ID P12
        if: runner.os == 'macOS'
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: bash .github/scripts/import-macos-p12.sh

      - name: Install JS dependencies
        run: |
          pnpm --dir ../niuma-ui install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Download CEF
        run: ${{ matrix.cef_cmd }}

      - name: Save CEF cache
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            NiuMa/third_party/cef
            NiuMa/third_party/cef-cache
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      - name: Build and pack
        env:
          NIUMA_CHANNEL: stable
          REQUIRE_CODESIGN: ${{ (runner.os == 'Windows' && secrets.WINDOWS_PFX_BASE64 != '') || (runner.os == 'macOS' && secrets.MACOS_P12_BASE64 != '') }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          CODESIGN_INSTALLER_IDENTITY: ${{ secrets.CODESIGN_INSTALLER_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: ${{ matrix.pack_cmd }}

      - name: Write SHA-256 checksums
        run: node .github/scripts/write-sha256.mjs "output/${{ matrix.artifact }}"

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v5
        with:
          name: niuma-${{ matrix.artifact }}
          path: NiuMa/output/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: GitHub Release
    needs: pack
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: niuma-*
          merge-multiple: false

      - name: Collect installer assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p release-files
          mapfile -t files < <(find dist -type f \( \
            -iname '*.exe' -o -iname '*.deb' -o -iname '*.rpm' -o \
            -iname '*.run' -o -iname '*.pkg' -o -iname '*.dmg' -o \
            -iname 'SHA256SUMS.txt' \
          \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installer artifacts were produced." >&2
            find dist -type f | head -n 50 >&2 || true
            exit 1
          fi
          : > release-files/SHA256SUMS.txt
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            if [[ "$base" == "SHA256SUMS.txt" ]]; then
              {
                echo "# from $(dirname "$f")"
                cat "$f"
                echo
              } >> release-files/SHA256SUMS.txt
            else
              cp -v "$f" "release-files/$base"
            fi
          done
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          find release-files -type f -printf '%p\n' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          {
            echo "## Release assets"
            ls -lh release-files
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
