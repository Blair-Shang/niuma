# NiuMa 本机构建打包流水线。
# 约束：build/pack/release 必须在目标 OS 上执行，禁止交叉编译。
# 托管 runner 覆盖：Windows x64、Linux x64、macOS arm64。
# ARM64 Windows / ARM64 Linux / 麒麟需自建 runner，未纳入本矩阵。
name: Pack and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      niuma_ui_version:
        description: 'npm niuma-ui 版本（latest 或 1.1.11）'
        type: string
        default: 'latest'

concurrency:
  group: pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  pack:
    name: pack (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: NiuMa
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows-x64
            pack_cmd: pnpm release:win
            cef_cmd: pnpm cef:download
            rust_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            artifact: linux-x64
            pack_cmd: pnpm release:linux
            cef_cmd: pnpm cef:download:linux
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-14
            artifact: macos-arm64
            pack_cmd: pnpm release:macos:arm64
            cef_cmd: pnpm cef:download:macos
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout NiuMa
        uses: actions/checkout@v5
        with:
          path: NiuMa

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
        working-directory: .

      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          set -euo pipefail
          df -h
          if [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]]; then
            sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL \
              || true
            docker system prune -af || true
            sudo apt-get clean || true
          fi
          df -h

      - name: Install Linux CEF / pack dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xz-utils \
            dpkg-dev fakeroot \
            libgtk-3-dev libgbm-dev libnss3-dev libxss-dev libasound2-dev \
            libcups2-dev libatk1.0-dev libpango1.0-dev libcairo2-dev \
            libx11-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libx11-xcb-dev libxcb-dri3-dev libdrm-dev libxkbcommon-dev \
            libxi-dev libxtst-dev libnotify-dev libglib2.0-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $iscc) {
            echo "$iscc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: NiuMa/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # 必须与仓库根 go.work 一致。setup-go 默认 GOTOOLCHAIN=local，
          # 若只装 1.25.0，Linux/macOS 的 go generate 都会失败。
          go-version: '1.25.7'
          cache-dependency-path: |
            NiuMa/go.work
            NiuMa/go.work.sum
            NiuMa/platform/go.sum
            NiuMa/services/**/go.sum
            NiuMa/packages/go/**/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust workspaces
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            NiuMa/services/ssh-service
            NiuMa/services/sftp-service
            NiuMa/services/redis-service
            NiuMa/packages/rust

      - name: Restore CEF cache
        id: cef-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            NiuMa/third_party/cef
            NiuMa/third_party/cef-cache
          key: cef-${{ matrix.artifact }}-${{ hashFiles('NiuMa/scripts/shared/setup/cef-pin.txt') }}
          restore-keys: |
            cef-${{ matrix.artifact }}-

      - name: Import Windows Authenticode PFX
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          pwsh -ExecutionPolicy Bypass -File .github/scripts/import-windows-pfx.ps1

      - name: Import macOS Developer ID P12
        if: runner.os == 'macOS'
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: bash .github/scripts/import-macos-p12.sh

      - name: Install JS dependencies
        # Windows 默认 pwsh，不能写 UI="..."。
        # pnpm --filter pkg set 会当成脚本名，改不到 web/package.json。
        # 必须用 add，才能把 link:../../niuma-ui 换成 npm 上的 niuma-ui。
        shell: bash
        env:
          NIUMA_UI_PKG: ${{ github.event.inputs.niuma_ui_version || vars.NIUMA_UI_VERSION || 'latest' }}
        run: |
          set -euo pipefail
          echo "Installing @niuma/ui from npm:niuma-ui@${NIUMA_UI_PKG}"
          pnpm --filter @niuma/web add "@niuma/ui@npm:niuma-ui@${NIUMA_UI_PKG}"
          # niuma-ui >= 1.2.0 只发 dist/；本机 link 才有 src/。用 Node resolve 跟 Vite 同一条路径。
          node -e '
            const { createRequire } = require("module");
            const { existsSync } = require("fs");
            const { dirname, join, resolve } = require("path");
            const r = createRequire(resolve("web/package.json"));
            const pkg = r.resolve("@niuma/ui/package.json");
            const root = dirname(pkg);
            const dist = join(root, "dist/index.js");
            const src = join(root, "src/index.ts");
            console.log("resolved", pkg);
            if (existsSync(dist)) {
              console.log("niuma-ui entry", dist);
              process.exit(0);
            }
            if (existsSync(src)) {
              console.log("niuma-ui source", src);
              process.exit(0);
            }
            console.error("niuma-ui has neither dist/index.js nor src/index.ts");
            process.exit(1);
          '

      - name: Download CEF
        run: ${{ matrix.cef_cmd }}

      - name: Save CEF cache
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            NiuMa/third_party/cef
            NiuMa/third_party/cef-cache
          key: ${{ steps.cef-cache.outputs.cache-primary-key }}

      - name: Build and pack
        env:
          NIUMA_CHANNEL: stable
          REQUIRE_CODESIGN: ${{ (runner.os == 'Windows' && secrets.WINDOWS_PFX_BASE64 != '') || (runner.os == 'macOS' && secrets.MACOS_P12_BASE64 != '') }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          CODESIGN_INSTALLER_IDENTITY: ${{ secrets.CODESIGN_INSTALLER_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: ${{ matrix.pack_cmd }}

      - name: Verify CEF runtime in pack output
        run: node .github/scripts/verify-pack-runtime.mjs "output/${{ matrix.artifact }}"

      - name: Write SHA-256 checksums
        run: node .github/scripts/write-sha256.mjs "output/${{ matrix.artifact }}"

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v5
        with:
          name: niuma-${{ matrix.artifact }}
          path: NiuMa/output/${{ matrix.artifact }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: GitHub Release
    needs: pack
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NIUMA_CLOUD_PIPELINE_TOKEN: ${{ secrets.NIUMA_CLOUD_PIPELINE_TOKEN }}
    steps:
      - name: Download pack artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: niuma-*
          merge-multiple: false

      - name: Collect installer assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p release-files
          # 只收用户安装包。output/*/dir 里的 niuma.exe、服务 exe、bootstrap
          # 以及 Uninstall.run 已打进安装包，不单独挂 GitHub Release。
          mapfile -t files < <(find dist -type f \( \
            -name 'NiuMa-*-Setup.exe' -o \
            -name 'NiuMa-*-Setup.run' -o \
            -name 'NiuMa-*-Setup.pkg' -o \
            -name 'NiuMa-*.dmg' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name 'SHA256SUMS.txt' \
          \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installer artifacts were produced." >&2
            find dist -type f | head -n 50 >&2 || true
            exit 1
          fi
          : > release-files/SHA256SUMS.txt
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            if [[ "$base" == "SHA256SUMS.txt" ]]; then
              {
                echo "# from $(dirname "$f")"
                cat "$f"
                echo
              } >> release-files/SHA256SUMS.txt
            else
              cp -v "$f" "release-files/$base"
            fi
          done
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          find release-files -type f -printf '%p\n' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          {
            echo "## Release assets"
            ls -lh release-files
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release scripts
        uses: actions/checkout@v5
        with:
          path: release-scripts
          sparse-checkout: |
            .github/scripts/push-cloud-release.mjs
            .github/scripts/prune-github-release-assets.mjs
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Upload installers to niuma-cloud
        if: env.NIUMA_CLOUD_PIPELINE_TOKEN != ''
        env:
          NIUMA_CLOUD_API_BASE: ${{ vars.NIUMA_CLOUD_API_BASE || 'https://www.niuma007.com/niuma/cloud' }}
          RELEASE_TAG: ${{ github.ref_name }}
          NIUMA_CHANNEL: stable
          NIUMA_PREVIEW_CHANNEL: beta
          CHANGELOG_PATH: release-scripts/CHANGELOG.md
        run: node release-scripts/.github/scripts/push-cloud-release.mjs release-files

      # 只删过旧 release 的安装包，保留页、tag、说明。官网分发走 niuma-cloud。
      # github.token / GITHUB_REPOSITORY 由 Actions 注入，不必再配仓库 Secret。
      - name: Prune old GitHub Release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node release-scripts/.github/scripts/prune-github-release-assets.mjs
