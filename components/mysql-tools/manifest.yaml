id: com.niuma.components.mysql-tools
name: MySQL 官方客户端工具
module: mysql
# 外部化组件：mysqldump / mysql CLI 不编进 platform / mysql-service。
# 当前 CSV / SQL 导入导出由 mysql-service 纯 Go 实现（io.*）；
# 本组件供后续可选切换官方 CLI，或用户本机已安装时探测使用。
install:
  mode: optional_download
  # 下载源按发行版配置；此处先登记探测与文档入口。
tools:
  - id: mysqldump
    displayName: mysqldump
    detect:
      executables:
        - mysqldump
      versionArgs:
        - --version
    install:
      mode: optional_download
      downloadPage: https://dev.mysql.com/downloads/mysql/
  - id: mysql
    displayName: mysql
    detect:
      executables:
        - mysql
      versionArgs:
        - --version
    install:
      mode: optional_download
      downloadPage: https://dev.mysql.com/downloads/mysql/
