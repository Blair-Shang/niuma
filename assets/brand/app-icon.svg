<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!--
    NiuMa 品牌剑形标 — 与应用内 .nm-brand-icon（tokens.css）同源配色。
    极光渐变（aurora a→e）+ 顶部高光叠层，白色剑形几何剪影。
    任务栏 / 安装包 / favicon 均由本文件经 scripts/gen-app-icon.mjs 生成。
  -->
  <defs>
    <linearGradient id="nmAurora" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ac8fa" />
      <stop offset="0.26" stop-color="#bf5af2" />
      <stop offset="0.52" stop-color="#ff375f" />
      <stop offset="0.76" stop-color="#64d2ff" />
      <stop offset="1" stop-color="#30d158" />
    </linearGradient>
    <linearGradient id="nmGloss" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.10" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#nmAurora)" />
  <rect width="512" height="512" rx="112" fill="url(#nmGloss)" />
  <g fill="#fff">
    <!-- 剑刃 -->
    <path d="M256 96 L286 292 L272 292 L256 268 L240 292 L226 292 Z" />
    <!-- 护手 -->
    <path d="M188 292 H324 V328 H188 Z" />
    <!-- 剑柄 -->
    <path d="M236 328 H276 V400 H236 Z" />
    <!-- 剑首 -->
    <rect x="224" y="400" width="64" height="20" rx="10" />
  </g>
</svg>
