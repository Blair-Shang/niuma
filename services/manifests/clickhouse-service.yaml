id: com.niuma.clickhouse
name: ClickHouse Service
version: 0.1.0
bridge:
  namespace: clickhouse
  connection_kind: clickhouse
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
    - tree.databases
    - tree.tables
    - tree.dictionaries
    - tree.categoryCounts
    - catalog.schemas
    - catalog.tables
    - catalog.columns
    - meta.columns
    - meta.tableInfo
    - meta.indexes
    - meta.ddl
    - meta.instanceOverview
    - meta.processes
    - meta.kill
    - meta.clusters
    - query.explain
    - ddl.designPreview
    - ddl.designApply
    - ddl.createTablePreview
    - ddl.createTable
    - ddl.objectScriptPreview
    - ddl.objectScriptApply
    - io.exportCsv
    - io.importCsv
    - io.dumpSql
    - io.execSqlFile
    # io.cancel 仅按 taskId 取消，无需注入连接凭据
runtime:
  executable: bin/niuma-clickhouse-service.exe
  executable_windows: bin/niuma-clickhouse-service.exe
  executable_unix: bin/niuma-clickhouse-service
  lang: go
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\niuma.clickhouse'
  address_windows: '\\.\pipe\niuma.clickhouse'
  address_unix: '/tmp/niuma.clickhouse.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
