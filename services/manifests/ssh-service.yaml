id: com.niuma.ssh
name: SSH Service
version: 0.1.0
bridge:
  namespace: ssh
  connection_kind: ssh
session:
  inject_credentials: true
  credential_methods:
    - session.open
    - session.test
runtime:
  executable: bin/niuma-ssh-service.exe
  executable_windows: bin/niuma-ssh-service.exe
  executable_unix: bin/niuma-ssh-service
  lang: rust
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\niuma.ssh'
  address_windows: '\\.\pipe\niuma.ssh'
  address_unix: '/tmp/niuma.ssh.sock'
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
