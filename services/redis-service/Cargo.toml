[package]
name = "niuma-redis-service"
description = "NiuMa Redis 能力服务（Layer 1）"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "niuma-redis-service"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
niuma-logutil = { path = "../../packages/rust/niuma-logutil" }
niuma-netproxy = { path = "../../packages/rust/niuma-netproxy" }
niuma-serviceipc = { path = "../../packages/rust/niuma-serviceipc" }
niuma-tunnel = { path = "../../packages/rust/niuma-tunnel" }
redis = { version = "1", features = ["tokio-comp", "cluster-async", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
